# Configurazione del Worker di salvataggio. Vedi cloud/LEGGIMI.md per i passi.
#
# Il valore di `id` qui sotto è un segnaposto: va sostituito con quello che
# Cloudflare stampa quando si crea lo spazio KV (`wrangler kv namespace create`).
# Senza, il deploy fallisce con «binding SAVES not found».

name = "eli-quest-save"
main = "worker.js"
compatibility_date = "2026-08-06"

# `SAVES` è il nome con cui il Worker vede lo spazio KV: nel codice compare come
# `env.SAVES`. Cambiare qui significa cambiarlo anche là.
[[kv_namespaces]]
binding = "SAVES"
id = "METTI_QUI_L_ID_DELLO_SPAZIO_KV"

# Spazio separato per le prove locali (`wrangler dev`), così sperimentare non
# tocca i salvataggi veri.
preview_id = "METTI_QUI_L_ID_DI_ANTEPRIMA"

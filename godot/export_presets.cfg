[preset.1.options]

variant/thread_support=false
; Il set di terreno sempre residente e' l'unico che usa compressione VRAM, e
; veniva impacchettato in ENTRAMBI i formati: 12 MB su 6 texture, di cui 6 MB
; di formato desktop che sul tablet non viene mai letto.
;
; ATTENZIONE, la ragione per cui era acceso e' reale: WebGL2 elenca ETC2 tra le
; feature core, ma ANGLE espone solo cio' che il driver supporta, e su GPU
; desktop ETC2 spesso non c'e'. Un pck col solo formato mobile faceva fallire il
; caricamento delle texture (terreno nero — verificato sul build).
;
; Resta spento perche' il bersaglio e' il tablet e 6 MB sono il 10% del pacchetto.
; Se serve provare la build Web da browser desktop, rimettere for_desktop=true:
; e' un cambio di preset, non di codice.
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=true
html/export_icon=true
html/custom_html_shell=""
; Il guscio HTML lo rigenera Godot a ogni export: qualunque modifica fatta a
; mano su `public/godot/outdoor/index.html` sparisce al primo `npm run
; export:web`. Questa riga e' l'unico punto in cui un aggancio sopravvive.
; Serve per lo schermo intero sul tablet — vedi `public/tablet-fullscreen.js`.
html/head_include="<script src=\"../../tablet-fullscreen.js\" defer></script>"
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=true


[preset.0]

name="Windows"
platform="Windows Desktop"
runnable=true
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter="assets/radura-academia-natural-atlas.png,assets/bosco-variabile-natural-atlas.png,assets/dorsale-geografica-natural-atlas.png,assets/cratere-logico-natural-atlas.png,assets/radura-accademia-hero-backdrop-v1.png,scripts/**/*_audit.gd,scripts/**/*_probe.gd,scripts/roundtrip_audit.gd,scripts/fixture_audit.gd,data/parity-fixtures.json"
patches=PackedStringArray()
encryption_include_filters=""

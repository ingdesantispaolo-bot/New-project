[preset.0.options]

binary_format/embed_pck=true
binary_format/architecture="x86_64"
texture_format/bptc=true
texture_format/s3tc=true
texture_format/etc=false
texture_format/etc2=false

[preset.1]

name="Web"
platform="Web"
runnable=true
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter="assets/radura-academia-natural-atlas.png,assets/bosco-variabile-natural-atlas.png,assets/dorsale-geografica-natural-atlas.png,assets/cratere-logico-natural-atlas.png,assets/radura-accademia-hero-backdrop-v1.png,scripts/**/*_audit.gd,scripts/**/*_probe.gd,scripts/roundtrip_audit.gd,scripts/fixture_audit.gd,data/parity-fixtures.json"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false

[preset.1.options]

variant/thread_support=false
; Servono ENTRAMBI i formati. WebGL2 elenca ETC2 tra le feature core, ma in
; pratica ANGLE espone solo cio' che il driver supporta: su GPU desktop ETC2
; spesso non c'e', e un pck con il solo formato mobile fa fallire il caricamento
; delle texture (terreno nero, sprite invisibili — verificato sul build).
; Il costo sul pacchetto e' contenuto perche' solo il set di terreno sempre
; residente usa la compressione VRAM; il resto resta lossy.
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=true
html/export_icon=true
html/custom_html_shell=""
html/head_include=""
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=true
